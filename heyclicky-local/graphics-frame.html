<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Isolated graphics frame</title>
</head>
<body>
  <script>
    "use strict";
    const MAX_PAYLOAD_CHARS = 150000;
    const MAX_THREE_MODULE_BASE64 = 8000000;

    function reportVisualError(message) {
      const safeMessage = String(message || "Unknown graphics error").replace(/\s+/g, " ").slice(0, 300);
      parent.postMessage({ type: "heyclicky-visual-error", message: safeMessage }, "*");
    }

    function validBase64(value) {
      return typeof value === "string" && value.length > 0 && value.length <= MAX_THREE_MODULE_BASE64 && /^[A-Za-z0-9+/=]+$/.test(value);
    }

    function renderVisual(data) {
      if (typeof data.payload !== "string" || data.payload.length === 0 || data.payload.length > MAX_PAYLOAD_CHARS) {
        reportVisualError("The visual payload was empty or too large.");
        return;
      }
      if (!validBase64(data.threeBase64)) {
        reportVisualError("The local Three.js module was missing or invalid.");
        return;
      }

      const diagnostics = `<script>
        function report(message) {
          parent.postMessage({ type: "heyclicky-visual-error", message: String(message || "Graphics script failed").slice(0, 300) }, "*");
        }
        addEventListener("error", (event) => report(event.message || "Graphics script failed to load"), true);
        addEventListener("unhandledrejection", (event) => report(event.reason?.message || event.reason || "Graphics promise rejected"));
        addEventListener("securitypolicyviolation", (event) => report("Blocked visual resource: " + event.violatedDirective));
      <\/script>`;
      const importMap = `<script type="importmap">{"imports":{"three":"data:text/javascript;base64,${data.threeBase64}"}}<\/script>`;
      const threeBootstrap = `<script type="module">
        import * as THREE from "three";
        window.THREE = THREE;
        parent.postMessage({ type: "heyclicky-three-ready", revision: THREE.REVISION }, "*");
      <\/script>`;
      const markup = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block}</style>${diagnostics}${importMap}${threeBootstrap}</head><body>${data.payload}</body></html>`;
      document.open();
      document.write(markup);
      document.close();
    }

    addEventListener("message", (event) => {
      if (event.source !== parent || event.data?.type !== "heyclicky-render") return;
      renderVisual(event.data);
    });
    parent.postMessage({ type: "heyclicky-frame-ready" }, "*");
  </script>
</body>
</html>
